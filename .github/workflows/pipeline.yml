name: Full CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🧪 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      # ✅ Fix import path
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # 🧹 Lint
      - name: Lint code
        run: |
          flake8 .

      # 🧪 Run tests
      - name: Run tests
        run: |
          pytest

      # 🐳 Build Docker image
      - name: Build Docker
        run: |
          docker build -t ci-demo:latest .

      # 📦 Load into KIND
      - name: Load image into KIND
        run: |
          kind load docker-image ci-demo:latest --name kind

      # ☸️ Deploy to Kubernetes
      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 🌐 Port forward (background)
      - name: Port Forward
        run: |
          kubectl port-forward svc/ci-demo 8080:80 &
